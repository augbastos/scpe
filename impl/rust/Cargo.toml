[package]
name = "scpe-verify"
version = "0.1.0"
edition = "2021"
description = "Independent Rust port of the SCPE scpe/0.1 reference verifier (SPEC.md §8)"

[lib]
name = "scpe_verify"
path = "src/lib.rs"

[[bin]]
name = "scpe-verify"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
