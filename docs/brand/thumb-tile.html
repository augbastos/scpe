<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css">
<style>
  /* 1200 x 1200 — the site's header lockup, magnified.
     Mark beside wordmark is the one logo the site actually has: 17px mark, 12px gap, SCPE at
     13px IBM Plex Mono 600 on 1.9px tracking. Those are the site's numbers, kept in the same
     ratios; only the block as a whole is scaled, so this is the header at tile size and not a
     logo drawn for this file. At 190px on a portfolio grid that is the largest the name can
     be set and still be the site's.
     Two earlier versions of this file got it wrong: one invented a display lockup with its
     own tracking, one reproduced the hero and read too small. Scale the block, never redraw it. */
  .frame { width: 1200px; height: 1200px; display: grid; place-items: center; }
  .frame::before, .frame::after { content: ''; position: absolute; pointer-events: none; }
  .frame::before { width: 900px; height: 900px; top: -300px; left: 150px; background: var(--wash-1); }
  .frame::after  { width: 820px; height: 820px; bottom: -300px; left: 220px; background: var(--wash-3); }

  /* the header row, at the site's px */
  .lock {
    position: relative; z-index: 1;
    /* The site's header sets this gap at 12px against a 17px mark. Tightened here because
       the wordmark's 1.9px tracking adds internal air that reads as a second gap once the
       block is this large — the lockup has to hold together at 190px, not at 13px. */
    display: flex; align-items: center; gap: 6px;
    transform: scale(15.2);
  }
  .lock svg { width: 17px; height: 17px; display: block; }
  .lock .word {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; font-weight: 600; letter-spacing: 1.9px;
    margin-right: -1.9px;   /* letter-spacing trails the E; pull it back so the lockup centres optically */
  }
</style>
</head>
<body>
<div class="frame">
  <div class="lock">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" fill="#0D1117"/><path fill="#E9EDF2" d="M10 12H26V19H17V45H26V52H10ZM54 12H38V19H47V45H38V52H54Z"/><path fill="#898CF2" d="M32 22.5 41.5 32 32 41.5 22.5 32Z"/></svg>
    <span class="word">SCPE</span>
  </div>
</div>
</body></html>
