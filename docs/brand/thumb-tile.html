<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css">
<style>
  /* 1200 x 1200 — the version for grid tiles, sized for the size it is actually seen at.
     A portfolio tile renders around 190px wide. Anything under roughly 70px in this file
     lands below 11px there and stops being read, so the strapline and the licence line are
     gone: at tile size they were texture, not information. What survives is the mark, the
     wordmark, and the expansion — and they are scaled to survive.
     Centred on both axes so a square or landscape crop still contains the lockup. */
  .frame { width: 1200px; height: 1200px; display: grid; place-items: center; }
  .frame::before, .frame::after { content: ''; position: absolute; pointer-events: none; }
  .frame::before { width: 900px; height: 900px; top: -360px; left: 150px; background: var(--wash-1); }
  .frame::after  { width: 860px; height: 860px; bottom: -360px; left: 190px; background: var(--wash-3); }

  .lockup { position: relative; z-index: 1; text-align: center; }
  .mark { width: 250px; height: 250px; display: block; margin: 0 auto 72px; }
  .word {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 236px; font-weight: 600; letter-spacing: 26px; line-height: 1;
    text-indent: 26px;   /* tracking adds a trailing gap; nudge back to true centre */
  }
  .expand {
    font-size: 62px; font-weight: 500; letter-spacing: -1.4px; line-height: 1.24;
    margin: 60px auto 0;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="lockup">
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" fill="#0D1117"/><path fill="#E9EDF2" d="M10 12H26V19H17V45H26V52H10ZM54 12H38V19H47V45H38V52H54Z"/><path fill="#898CF2" d="M32 22.5 41.5 32 32 41.5 22.5 32Z"/></svg>
    <div class="word">SCPE</div>
    <div class="expand">Signed Contribution<br>Provenance Envelope</div>
  </div>
</div>
</body></html>
