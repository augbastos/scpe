<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css">
<style>
  /* 1200 x 1200 — the version for grid tiles.
     thumb.html follows the site's left-aligned hero, which is right for a poster and wrong
     for a thumbnail: a portfolio grid crops to its own aspect and lands on the empty right
     half, so the tile renders as a blank white rectangle. Here the lockup is centred on both
     axes with symmetric margins, so any centred crop — square or landscape — still contains
     it. Same tokens, same mark, same strapline; only the composition changes. */
  .frame { width: 1200px; height: 1200px; display: grid; place-items: center; }
  .frame::before, .frame::after { content: ''; position: absolute; pointer-events: none; }
  .frame::before { width: 900px; height: 900px; top: -380px; left: 150px; background: var(--wash-1); }
  .frame::after  { width: 820px; height: 820px; bottom: -380px; left: 230px; background: var(--wash-3); }

  .lockup { position: relative; z-index: 1; text-align: center; }
  .mark { width: 132px; height: 132px; display: block; margin: 0 auto 52px; }
  .word {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 132px; font-weight: 600; letter-spacing: 16px; line-height: 1;
    text-indent: 16px;   /* the tracking adds a trailing gap; nudge back to true centre */
  }
  .expand { font-size: 40px; font-weight: 500; letter-spacing: -.7px; margin-top: 40px; }
  .rule { height: 1px; background: var(--line); margin: 56px auto 0; width: 62%; }
  .strap {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 19px; letter-spacing: 1px; color: var(--body); margin-top: 28px;
  }
  .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px; letter-spacing: .8px; color: var(--faint); margin-top: 14px;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="lockup">
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" fill="#0D1117"/><path fill="#E9EDF2" d="M10 12H26V19H17V45H26V52H10ZM54 12H38V19H47V45H38V52H54Z"/><path fill="#898CF2" d="M32 22.5 41.5 32 32 41.5 22.5 32Z"/></svg>
    <div class="word">SCPE</div>
    <div class="expand">Signed Contribution Provenance Envelope</div>
    <div class="rule"></div>
    <div class="strap">Merge code, not claims.</div>
    <div class="meta">scpe/0.1 &nbsp;·&nbsp; code licensed Apache-2.0</div>
  </div>
</div>
</body></html>
