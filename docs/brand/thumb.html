<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css">
<style>
  /* 1200 x 1200 — the site's hero, squared. Same wash, same wordmark, same strapline. */
  .frame { width: 1200px; height: 1200px; }
  .frame::before, .frame::after { content: ''; position: absolute; pointer-events: none; }
  .frame::before { width: 820px; height: 820px; top: -430px; left: 90px;  background: var(--wash-1); }
  .frame::after  { width: 780px; height: 780px; top: -390px; left: 520px; background: var(--wash-2); }
  .frame .wash3 { position: absolute; width: 720px; height: 720px; bottom: -430px; left: 300px; background: var(--wash-3); pointer-events: none; }

  .frame .scaler {
    width: 620px; transform: scale(1.5); top: 236px; left: 96px; z-index: 1;
  }
  .mark { width: 92px; height: 92px; display: block; margin: 0 0 44px; }
  .square-word {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 92px; font-weight: 600; letter-spacing: 12px; line-height: 1;
  }
  .expand { font-size: 29px; font-weight: 500; letter-spacing: -.522px; margin-top: 28px; }
  .strap {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px; letter-spacing: .8px; color: var(--body);
    margin-top: 96px; display: flex; flex-direction: column; gap: 10px;
  }
  .strap .rule { height: 1px; background: var(--line); margin-bottom: 8px; }
  .strap .meta { color: var(--faint); }
</style>
</head>
<body>
<div class="frame">
  <div class="wash3"></div>
  <div class="scaler">
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" fill="#0D1117"/><path fill="#E9EDF2" d="M10 12H26V19H17V45H26V52H10ZM54 12H38V19H47V45H38V52H54Z"/><path fill="#898CF2" d="M32 22.5 41.5 32 32 41.5 22.5 32Z"/></svg>
    <div class="square-word">SCPE</div>
    <div class="expand">Signed Contribution Provenance Envelope</div>
    <div class="strap">
      <div class="rule"></div>
      <div>Merge code, not claims.</div>
      <div class="meta">scpe/0.1 &nbsp;·&nbsp; code licensed Apache-2.0</div>
    </div>
  </div>
</div>
</body></html>
