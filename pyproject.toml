[build-system]
# >=77 is the floor that reads `license` below as a PEP 639 SPDX expression rather than as
# legacy free text. Older setuptools still builds this file, it just records the license the
# old way — pinning the floor keeps the published metadata the same wherever it is built.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scpe-protocol"
version = "1.0.0.dev0"
description = "SCPE: a signed, checkable claim about what produced a file, and a verifier that reports exactly what it checked and what it did not. An in-toto predicate type in a DSSE envelope, stored as a detached sidecar, verified offline with no server, no CA and no account."
readme = "README.md"
requires-python = ">=3.11"
# A bare SPDX expression (PEP 639), not `{ text = ... }` and not a `License ::` classifier:
# setuptools deprecates both older spellings, and a build that prints deprecation warnings
# is a build whose real warnings stop being read.
license = "Apache-2.0"
authors = [{ name = "Augusto Bastos" }]
keywords = ["provenance", "attestation", "in-toto", "dsse", "supply-chain", "ai", "content-credentials", "sshsig", "verification", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Environment :: Console",
]
# Deliberately empty. Stdlib only is not minimalism for its own sake: it is what lets the
# verifier be one auditable file that runs straight from a checkout with no install step, so
# the bytes producing a verdict are the bytes the caller pinned rather than whatever a package
# index happens to serve. Signatures are checked by `ssh-keygen -Y verify` (OpenSSH >= 8.2),
# never by a Python crypto library.
dependencies = []

[project.urls]
Homepage = "https://github.com/augbastos/scpe"
Repository = "https://github.com/augbastos/scpe"
Documentation = "https://github.com/augbastos/scpe/blob/main/spec/SPECIFICATION.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

# The `scpe` console script belonged to the retired scpe/0.1 pull-request CLI and is gone
# with it. Naming the same entry point for a different protocol would hand anyone who runs
# `pip install scpe-protocol && scpe verify` a tool that silently verifies the wrong format.
[project.scripts]
scpe-verify = "reference.scpe_verify:main"
scpe-sign = "reference.scpe_sign:main"

[tool.setuptools.packages.find]
include = ["reference*"]
