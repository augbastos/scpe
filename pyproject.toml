[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scpe-protocol"
version = "0.1.2"
description = "SCPE: an open protocol for verifiable provenance of any digital artifact — who produced a contribution or file, and that it wasn't tampered with, verified offline with no server and no new accounts. Reference implementation + CLI (the console command is `scpe`)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Augusto Bastos" }]
keywords = ["github", "contributions", "open-source", "supply-chain", "provenance", "attestation", "in-toto", "dsse", "code-signing", "ssh", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Environment :: Console",
]
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/augbastos/scpe"
Repository = "https://github.com/augbastos/scpe"
Documentation = "https://github.com/augbastos/scpe/blob/main/spec/SPEC.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
mcp = ["mcp>=1.2"]

[project.scripts]
scpe = "scpe.cli:main"
scpe-mcp = "scpe.mcp_server:main"
scpe-envelope = "reference.producer:main"

[tool.setuptools.packages.find]
include = ["scpe*", "reference*"]
