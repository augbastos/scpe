    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

              const { done, value } = await reader.read();
              if (done) break;

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rge }}\" hint-placeholder-val=\"{{ true }}\">\n<svg sc-camel-view-box=\"0 0 64 64\" width=\"60\" height=\"60\" style=\"display:block\" aria-hidden=\"true\"><path fill=\"#171A1F\" d=\"M10 12H26V19H17V45H26V52H10ZM54 12H38V19H47V45H38V52H54Z\"><\u002Fpath><path fill=\"#4F51D8\" d=\"M32 22.5 41.5 32 32 41.5 22.5 32Z\"><\u002Fpath><\u002Fsvg>\n<\u002Fsc-if>\n<h1 style=\"font:500 clamp(28px,5.4vw,48px)/1.14 'IBM Plex Sans',sans-serif;letter-spacing:-0.025em;color:#171A1F;max-width:25ch;text-wrap:balance\">A signature on the file, and on the AI claim.<\u002Fh1>\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;font:400 12.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:.02em\">\n<span style=\"color:#171A1F;font-weight:500\">Signed Content Provenance Evidence</span>\n<span style=\"color:#8A94A3\" aria-hidden=\"true\">·</span>\n<span style=\"color:#33349E\">One record. Any file.<\u002Fspan>\n<span style=\"color:#8A94A3\" aria-hidden=\"true\">·<\u002Fspan>\n<span style=\"color:#3E4654\">Trust the file, not the claim.<\u002Fspan>\n<\u002Fdiv>\n<p style=\"font:400 17px/1.65 'IBM Plex Sans',sans-serif;color:#3E4654;max-width:640px;text-wrap:pretty\">An open protocol: a signed record that proves <span style=\"color:#171A1F;font-weight:500\">who signed<\u002Fspan> a file and that <span style=\"color:#171A1F;font-weight:500\">nothing<\u002Fspan> was tampered with. Verified with no SCPE server and no new accounts.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:8px\">\n<div style=\"display:flex;align-items:center;gap:14px;min-width:0;max-width:100%;padding:13px 14px;background:rgba(240,242,247,0.80);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:10px;overflow-x:auto\">\n<span style=\"font:400 13.5px/1.5 'IBM Plex Mono',monospace;color:#5A6472;flex:none\" aria-hidden=\"true\">$<\u002Fspan>\n<code style=\"font:400 13.5px/1.5 'IBM Plex Mono',monospace;color:#171A1F;white-space:pre\">pipx install scpe-protocol<\u002Fcode>\n<button type=\"button\" sc-camel-on-click=\"{{ copyInstall }}\" aria-label=\"Copy install command\" style=\"flex:none;margin-left:6px;font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#5A6472;background:#FFFFFF;border:1px solid #D8DDE5;border-radius:5px;padding:7px 9px;cursor:pointer;transition:color .18s ease,border-color .18s ease,box-shadow .18s ease\" style-hover=\"color:#171A1F;border-color:#4F51D8;box-shadow:0 8px 20px -12px rgba(79,81,216,0.5)\">copy<\u002Fbutton>\n<\u002Fdiv>\n<span style=\"width:56px;font:500 11.5px/1 'IBM Plex Mono',monospace;color:#2F7D52\"><sc-if value=\"{{ copiedInstall }}\" hint-placeholder-val=\"{{ false }}\">copied<\u002Fsc-if><\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:8px 14px;font:400 11.5px/1.6 'IBM Plex Mono',monospace;color:#3E4654;letter-spacing:.03em\">\n<span>scpe/1<\u002Fspan><span style=\"color:#8A94A3\" aria-hidden=\"true\">·<\u002Fspan>\n<span>code licensed Apache-2.0<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:52px 0;border-top:1px solid #E7EAEF\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">01<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">The problem<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">A file arrives from someone you don't know.<\u002Fh2>\n<p style=\"margin-top:18px;font:400 16px/1.7 'IBM Plex Sans',sans-serif;color:#5A6472;max-width:640px;text-wrap:pretty\">A person, or increasingly an AI agent. Trust rests on three things: a filename, where it came from, and reading it by eye.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"padding:52px 0;border-top:1px solid #E7EAEF\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">02<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">What SCPE adds<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">A signed envelope. Verified where you already are.<\u002Fh2>\n\n<div style=\"margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px\">\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#4F51D8;text-transform:uppercase\">Identity<\u002Fdiv>\n<p style=\"margin-top:14px;font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">Proves who signed a file — not who wrote it, or who had the idea.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#4F51D8;text-transform:uppercase\">Integrity<\u002Fdiv>\n<p style=\"margin-top:14px;font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">Proves nothing was tampered with.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#4F51D8;text-transform:uppercase\">No server<\u002Fdiv>\n<p style=\"margin-top:14px;font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">There is no SCPE server, ever. No new accounts.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:14px;background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;overflow:hidden\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #E7EAEF\">\n<span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">Key anchors — tried in this order<\u002Fspan>\n<span role=\"group\" aria-label=\"Key anchor\" style=\"margin-left:auto;display:flex;flex-wrap:wrap;gap:6px\">\n<button type=\"button\" sc-camel-on-click=\"{{ pickFlag }}\" aria-pressed=\"{{ flagPressed }}\" style=\"font:400 12.5px/1 'IBM Plex Sans',sans-serif;color:#171A1F;background:#FFFFFF;border:1px solid #D8DDE5;border-radius:5px;padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:border-color .18s ease,box-shadow .18s ease\" style-hover=\"border-color:#4F51D8;box-shadow:0 10px 26px -14px rgba(79,81,216,0.55)\">\n<span style=\"width:8px;display:inline-flex;justify-content:center;font-size:8px;color:#4F51D8;flex:none\"><sc-if value=\"{{ onFlag }}\" hint-placeholder-val=\"{{ true }}\">◆<\u002Fsc-if><\u002Fspan>flag\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ pickBundled }}\" aria-pressed=\"{{ bundledPressed }}\" style=\"font:400 12.5px/1 'IBM Plex Sans',sans-serif;color:#171A1F;background:#FFFFFF;border:1px solid #D8DDE5;border-radius:5px;padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:border-color .18s ease,box-shadow .18s ease\" style-hover=\"border-color:#4F51D8;box-shadow:0 10px 26px -14px rgba(79,81,216,0.55)\">\n<span style=\"width:8px;display:inline-flex;justify-content:center;font-size:8px;color:#4F51D8;flex:none\"><sc-if value=\"{{ onBundled }}\" hint-placeholder-val=\"{{ false }}\">◆<\u002Fsc-if><\u002Fspan>bundled\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ pickForge }}\" aria-pressed=\"{{ forgePressed }}\" style=\"font:400 12.5px/1 'IBM Plex Sans',sans-serif;color:#171A1F;background:#FFFFFF;border:1px solid #D8DDE5;border-radius:5px;padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:border-color .18s ease,box-shadow .18s ease\" style-hover=\"border-color:#4F51D8;box-shadow:0 10px 26px -14px rgba(79,81,216,0.55)\">\n<span style=\"width:8px;display:inline-flex;justify-content:center;font-size:8px;color:#4F51D8;flex:none\"><sc-if value=\"{{ onForge }}\" hint-placeholder-val=\"{{ false }}\">◆<\u002Fsc-if><\u002Fspan>forge\n<\u002Fbutton>\n<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ onFlag }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 20px;padding:22px 20px\">\n<span style=\"font:500 clamp(26px,4vw,36px)/1 'IBM Plex Mono',monospace;color:#2F7D52;letter-spacing:-0.03em\">0<\u002Fspan>\n<span style=\"font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472;max-width:620px;text-wrap:pretty\">Network calls — <code style=\"font:400 13px/1 'IBM Plex Mono',monospace;color:#171A1F\">flag<\u002Fcode>: a keys file the operator supplied. Tried before anything else; fully offline.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ onBundled }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 20px;padding:22px 20px\">\n<span style=\"font:500 clamp(26px,4vw,36px)/1 'IBM Plex Mono',monospace;color:#2F7D52;letter-spacing:-0.03em\">0<\u002Fspan>\n<span style=\"font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472;max-width:620px;text-wrap:pretty\">Network calls — <code style=\"font:400 13px/1 'IBM Plex Mono',monospace;color:#171A1F\">bundled<\u002Fcode>: a keys file that came inside the submission itself. A <span style=\"color:#171A1F;font-weight:500\">verified<\u002Fspan> anchored here was checked against keys the submitter chose — a legitimate signature that proves nothing about the declared account.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ onForge }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 20px;padding:22px 20px\">\n<span style=\"font:500 clamp(26px,4vw,36px)/1 'IBM Plex Mono',monospace;color:#171A1F;letter-spacing:-0.03em\">1<\u002Fspan>\n<span style=\"font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472;max-width:620px;text-wrap:pretty\">HTTPS GET — <code style=\"font:400 13px/1 'IBM Plex Mono',monospace;color:#171A1F\">forge<\u002Fcode>: the contributor's own git host, for signing keys that host already publishes. The last resort, not the default.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:14px 20px;border-top:1px solid #E7EAEF\">\n<code style=\"flex:none;font:400 12px/1 'IBM Plex Mono',monospace;color:#171A1F;background:#FFFFFF;border:1px solid #D8DDE5;border-radius:4px;padding:5px 8px\">key_source<\u002Fcode>\n<span style=\"flex:1;min-width:240px;font:400 13.5px/1.6 'IBM Plex Sans',sans-serif;color:#5A6472;text-wrap:pretty\">The verifier reports which anchor answered — a <span style=\"color:#171A1F;font-weight:500\">verified<\u002Fspan> against bundled keys is no longer the same word as one the forge backs.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:52px 0;border-top:1px solid #E7EAEF\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">03<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">AI disclosure<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">The AI claim is signed — not typed into a form.<\u002Fh2>\n<p style=\"margin-top:18px;font:400 16px/1.7 'IBM Plex Sans',sans-serif;color:#5A6472;max-width:660px;text-wrap:pretty\">A file arrives and you want to know who signed it and which AI they said they used. In SCPE that declaration travels inside the signed record: the claim, the author, and the bytes cannot be separated.<\u002Fp>\n<div style=\"margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px\">\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#4F51D8;text-transform:uppercase\">Attributable<\u002Fdiv>\n<p style=\"margin-top:14px;font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">The claim is bound to the identity that signed it — it cannot be separated from its author afterwards.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#4F51D8;text-transform:uppercase\">Tamper-evident<\u002Fdiv>\n<p style=\"margin-top:14px;font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">Bound to these exact bytes. Edit the claim later, or attach it to other code, and verification fails.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#4F51D8;text-transform:uppercase\">Not a lie detector<\u002Fdiv>\n<p style=\"margin-top:14px;font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">A signature does not make the claim true. Whether someone told the truth about their tools is still human judgment.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:52px 0;border-top:1px solid #E7EAEF\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">04<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">The seal<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">A decision, first.<\u002Fh2>\n<p style=\"margin-top:18px;font:400 16px/1.7 'IBM Plex Sans',sans-serif;color:#5A6472;max-width:660px;text-wrap:pretty\">SCPE ships as one auditable file — <span style=\"color:#171A1F;font-weight:500\">scpe verify<\u002Fspan> that you run on any file. It reports a decision first, then what it checked: identity, key source, what the signer merely declared about AI use, and what the signature did not establish — and it refuses a record signed for different bytes.<\u002Fp>\n\n<div style=\"margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start\">\n<sc-if value=\"{{ showVerified }}\" hint-placeholder-val=\"{{ true }}\">\n<figure style=\"background:rgba(255,255,255,0.84);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;overflow:hidden\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid #E7EAEF;background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%\">\n<svg sc-camel-view-box=\"0 0 64 64\" width=\"17\" height=\"17\" style=\"display:block;flex:none\" aria-hidden=\"true\"><path fill=\"#171A1F\" d=\"M10 12H26V19H17V45H26V52H10ZM54 12H38V19H47V45H38V52H54Z\"><\u002Fpath><path fill=\"#4F51D8\" d=\"M32 22.5 41.5 32 32 41.5 22.5 32Z\"><\u002Fpath><\u002Fsvg>\n<span style=\"font:600 11.5px/1 'IBM Plex Sans',sans-serif;letter-spacing:.14em;color:#171A1F;text-transform:uppercase\">scpe verify<\u002Fspan>\n<span style=\"margin-left:auto;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#0D1117;background:#58C983;border-radius:4px;padding:5px 8px;text-transform:uppercase\">verified<\u002Fspan>\n<\u002Fdiv>\n<ul style=\"padding:6px 18px 14px\">\n<li style=\"display:flex;flex-wrap:wrap;gap:4px 16px;padding:11px 0;border-bottom:1px solid #E7EAEF\"><span style=\"width:88px;flex:none;font:400 12.5px/1.5 'IBM Plex Mono',monospace;color:#5A6472\">identity<\u002Fspan><span style=\"font:400 14px/1.5 'IBM Plex Sans',sans-serif;color:#171A1F\">signature verified<\u002Fspan><\u002Fli>\n<li style=\"display:flex;flex-wrap:wrap;gap:4px 16px;padding:11px 0;border-bottom:1px solid #E7EAEF\"><span style=\"width:88px;flex:none;font:400 12.5px/1.5 'IBM Plex Mono',monospace;color:#5A6472\">key_source<\u002Fspan><span style=\"font:400 14px/1.5 'IBM Plex Sans',sans-serif;color:#171A1F\"><span style=\"font:400 13px/1.5 'IBM Plex Mono',monospace\">forge<\u002Fspan> — keys published by the contributor's git host<\u002Fspan><\u002Fli>\n<li style=\"display:flex;flex-wrap:wrap;gap:4px 16px;padding:11px 0;border-bottom:1px solid #E7EAEF\"><span style=\"width:88px;flex:none;font:400 12.5px/1.5 'IBM Plex Mono',monospace;color:#5A6472\">risk band<\u002Fspan><span style=\"font:400 14px/1.5 'IBM Plex Sans',sans-serif;color:#171A1F\">reported by the seal<\u002Fspan><\u002Fli>\n<li style=\"display:flex;flex-wrap:wrap;gap:4px 16px;padding:11px 0;border-bottom:1px solid #E7EAEF\"><span style=\"width:88px;flex:none;font:400 12.5px/1.5 'IBM Plex Mono',monospace;color:#5A6472\">tests<\u002Fspan><span style=\"font:400 14px/1.5 'IBM Plex Sans',sans-serif;color:#171A1F\">reported by the seal<\u002Fspan><\u002Fli>\n<li style=\"display:flex;flex-wrap:wrap;gap:4px 16px;padding:11px 0\"><span style=\"width:88px;flex:none;font:400 12.5px/1.5 'IBM Plex Mono',monospace;color:#5A6472\">provenance<\u002Fspan><span style=\"font:400 14px/1.5 'IBM Plex Sans',sans-serif;color:#171A1F\">signed envelope, scpe/1<\u002Fspan><\u002Fli>\n<\u002Ful>\n<figcaption style=\"padding:0 18px 16px;font:400 12.5px/1.6 'IBM Plex Sans',sans-serif;color:#5A6472\">Illustrative layout — field values come from the file under review. The key_source field shows which anchor the keys came from.<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fsc-if>\n<sc-if value=\"{{ showFailing }}\" hint-placeholder-val=\"{{ true }}\">\n<figure style=\"background:rgba(255,255,255,0.84);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;overflow:hidden\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid #E7EAEF;background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%\">\n<svg sc-camel-view-box=\"0 0 64 64\" width=\"17\" height=\"17\" style=\"display:block;flex:none\" aria-hidden=\"true\"><path fill=\"#171A1F\" d=\"M10 12H26V19H17V45H26V52H10ZM54 12H38V19H47V45H38V52H54Z\"><\u002Fpath><path fill=\"#4F51D8\" d=\"M32 22.5 41.5 32 32 41.5 22.5 32Z\"><\u002Fpath><\u002Fsvg>\n<span style=\"font:400 12.5px/1 'IBM Plex Mono',monospace;color:#171A1F\">not_checked<\u002Fspan>\n<span style=\"margin-left:auto;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#E9EDF2;background:#5C2B2E;border-radius:4px;padding:5px 8px;text-transform:uppercase\">always present<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:20px 18px\">\n<p style=\"font:400 14.5px/1.7 'IBM Plex Sans',sans-serif;color:#5A6472;text-wrap:pretty\">The <code style=\"font:400 13px/1 'IBM Plex Mono',monospace;color:#171A1F\">not_checked<\u002Fcode> block is always present: a pass names its own limits, so it is never read as a blank cheque.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffigure>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:52px 0;border-top:1px solid #E7EAEF\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">05<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">Conformance<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">Two profiles. One verdict.<\u002Fh2>\n<p style=\"margin-top:18px;font:400 16px/1.7 'IBM Plex Sans',sans-serif;color:#5A6472;max-width:660px;text-wrap:pretty\">Core is a complete, safe verifier that a competent engineer reaches in a working day: exact-byte signing, duplicate-key refusal, digest binding, one suite, one anchor. Full adds derivation chains, time anchors and countersignatures. A Core verifier refuses what it does not implement rather than ignoring it, so a smaller verifier is never a weaker one, only a narrower one that says so. Two ship here: a Python reference at Full and a Go one at Core, each measured against the vectors for the profile it declares.<\u002Fp>\n\n<div style=\"margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px\">\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n<span style=\"font:500 16px/1 'IBM Plex Sans',sans-serif;color:#171A1F\">Python<\u002Fspan>\n<span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8;text-transform:uppercase\">full profile<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n<span style=\"font:500 16px/1 'IBM Plex Sans',sans-serif;color:#171A1F\">Go<\u002Fspan>\n<span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#5A6472;text-transform:uppercase\">core profile<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"margin-top:14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px;background:rgba(240,242,247,0.80);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px\">\n<span style=\"font:500 clamp(26px,4vw,36px)/1 'IBM Plex Mono',monospace;color:#171A1F;letter-spacing:-0.03em\">16<\u002Fspan>\n<span style=\"font:400 14.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">normative test vectors — the same status, or the implementation is wrong.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"position:relative;padding:52px 0;border-top:1px solid #E7EAEF\">\n\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">06<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">Profiles<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">One predicate. Any file.<\u002Fh2>\n<p style=\"margin-top:18px;font:400 16px/1.7 'IBM Plex Sans',sans-serif;color:#5A6472;max-width:660px;text-wrap:pretty\">Select a profile. The verdict does not move.<\u002Fp>\n\n<div style=\"margin-top:26px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n<div role=\"group\" aria-label=\"SCPE profiles\" style=\"flex:1 1 250px;display:flex;flex-direction:column;gap:8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ pC }}\" aria-pressed=\"{{ prC }}\" style=\"display:flex;align-items:center;gap:14px;text-align:left;background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;isolation:isolate;cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease\" style-hover=\"border-color:#4F51D8;box-shadow:0 10px 26px -14px rgba(79,81,216,0.55)\">\n<sc-if value=\"{{ onC }}\" hint-placeholder-val=\"{{ false }}\">\n<span aria-hidden=\"true\" style=\"position:absolute;left:-6%;top:-70%;width:56%;height:240%;z-index:-1;display:block;pointer-events:none;animation:scpeCloudPass 21s linear -6s infinite\"><span style=\"position:absolute;inset:0;display:block;background-image:radial-gradient(44% 68% at 26% 52%, rgba(79,81,216,0.42), rgba(79,81,216,0) 72%),radial-gradient(36% 58 ans',sans-serif;color:#5A6472\">— identical for every profile<\u002Fspan><span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan><\u002Fdiv>\n<ul>\n<li style=\"display:flex;flex-wrap:wrap;gap:6px 16px;padding:13px 0;border-bottom:1px solid #E7EAEF\"><span style=\"width:24px;flex:none;font:500 11px/1.6 'IBM Plex Mono',monospace;color:#4F51D8\">1<\u002Fspan><span style=\"width:70px;flex:none;font:500 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#5A6472\">Seal<\u002Fspan><span style=\"flex:1;min-width:220px;font:400 14px/1.6 'IBM Plex Sans',sans-serif;color:#171A1F\">The file is recorded in an SCPE sidecar.<\u002Fspan><\u002Fli>\n<li style=\"display:flex;flex-wrap:wrap;gap:6px 16px;padding:13px 0;border-bottom:1px solid #E7EAEF\"><span style=\"width:24px;flex:none;font:500 11px/1.6 'IBM Plex Mono',monospace;color:#4F51D8\">2<\u002Fspan><span style=\"width:70px;flex:none;font:500 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#5A6472\">Sign<\u002Fspan><span style=\"flex:1;min-width:220px;font:400 14px/1.6 'IBM Plex Sans',sans-serif;color:#171A1F\">The envelope is signed with the contributor’s key.<\u002Fspan><\u002Fli>\n<li style=\"display:flex;flex-wrap:wrap;gap:6px 16px;padding:13px 0;border-bottom:1px solid #E7EAEF\"><span style=\"width:24px;flex:none;font:500 11px/1.6 'IBM Plex Mono',monospace;color:#4F51D8\">3<\u002Fspan><span style=\"width:70px;flex:none;font:500 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#5A6472\">Verify<\u002Fspan><span style=\"flex:1;min-width:220px;font:400 14px/1.6 'IBM Plex Sans',sans-serif;color:#171A1F\">Keys come from the first anchor that answers: a repo-owner keys file, keys bundled with the submission, or — last — the contributor’s git host. The verifier reports which, in key_source.<\u002Fspan><\u002Fli>\n<li style=\"display:flex;flex-wrap:wrap;gap:6px 16px;padding:13px 0;border-bottom:1px solid #E7EAEF\"><span style=\"width:24px;flex:none;font:500 11px/1.6 'IBM Plex Mono',monospace;color:#4F51D8\">4<\u002Fspan><span style=\"width:70px;flex:none;font:500 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#5A6472\">Verdict<\u002Fspan><span style=\"flex:1;min-width:220px;font:400 14px/1.6 'IBM Plex Sans',sans-serif;color:#171A1F\">Core covers 13 vectors, Full covers all 16, and each declares which.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<div style=\"margin-top:16px;display:flex;flex-wrap:wrap;gap:6px 16px;font:400 13.5px/1.5 'IBM Plex Mono',monospace\"><span style=\"width:80px;flex:none;color:#5A6472\">verdict<\u002Fspan><span style=\"color:#2F7D52\">verified<\u002Fspan><\u002Fdiv>\n<p style=\"margin-top:14px;font:400 13.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472;text-wrap:pretty\">The profile never changes the verdict. Normative detail for each profile lives in the <a href=\"https://github.com/augbastos/scpe\">SPEC, in the repo<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:52px 0;border-top:1px solid #E7EAEF\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">07<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">Assurance levels<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">A ladder you climb when you want to.<\u002Fh2>\n\n<ul style=\"margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:10px\">\n<li style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n<span style=\"font:500 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8;flex:none\">LEVEL 1<\u002Fspan>\n<span style=\"flex:1;display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:500 15.5px/1.4 'IBM Plex Sans',sans-serif;color:#171A1F\">AI-disclosure lint<\u002Fspan>\n<span style=\"font:400 14px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">Zero friction: no envelope, no signing key, no install.<\u002Fspan>\n<\u002Fspan>\n<span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#5A6472;border:1px solid #D8DDE5;border-radius:4px;padding:6px 8px;align-self:flex-start;margin-top:auto\">zero friction<\u002Fspan>\n<\u002Fli>\n<li style=\"background:rgba(255,255,255,0.84);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #D8DDE5;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n<span style=\"font:500 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8;flex:none\">LEVEL 2<\u002Fspan>\n<span style=\"flex:1;display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:500 15.5px/1.4 'IBM Plex Sans',sans-serif;color:#171A1F\">Signed envelope required<\u002Fspan>\n<span style=\"font:400 14px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">A valid signed envelope with a forge-backed identity anchor, signed for THIS repository and this history. Keys bundled with the submission do not pass, and neither does a valid envelope replayed from somewhere else. Implies level 1.<\u002Fspan>\n<\u002Fspan>\n<span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#0D1117;background:#58C983;border-radius:4px;padding:6px 8px;align-self:flex-start;margin-top:auto\">default<\u002Fspan>\n<\u002Fli>\n<li style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #5C2B2E;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n<span style=\"font:500 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#5A6472;flex:none\">LEVEL 3<\u002Fspan>\n<span style=\"flex:1;display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:500 15.5px/1.4 'IBM Plex Sans',sans-serif;color:#171A1F\">Third-party countersignature<\u002Fspan>\n<span style=\"font:400 14px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">On the roadmap. Not implemented. Do not plan around it yet.<\u002Fspan>\n<\u002Fspan>\n<span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E9EDF2;background:#5C2B2E;border-radius:4px;padding:6px 8px;align-self:flex-start;margin-top:auto\">not implemented<\u002Fspan>\n<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section style=\"padding:52px 0;border-top:1px solid #E7EAEF\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">08<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">Measured cost<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">What it costs to carry.<\u002Fh2>\n\n<div ref=\"{{ refCost }}\" style=\"margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px\">\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n<span style=\"font:500 clamp(26px,4vw,33px)/1 'IBM Plex Mono',monospace;color:#171A1F;letter-spacing:-0.03em\" ref=\"{{ refKB }}\">~1.5 KB<\u002Fspan>\n<span style=\"font:400 13.5px/1.6 'IBM Plex Sans',sans-serif;color:#5A6472\">Standalone envelope for a Standalone record for one file, as a detached sidecar.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n<span style=\"font:500 clamp(26px,4vw,33px)/1 'IBM Plex Mono',monospace;color:#171A1F;letter-spacing:-0.03em\" ref=\"{{ refCold }}\">~200 ms<\u002Fspan>\n<span style=\"font:400 13.5px/1.6 'IBM Plex Sans',sans-serif;color:#5A6472\">Verify wall-time, cold CLI.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n<span style=\"font:500 clamp(26px,4vw,33px)/1 'IBM Plex Mono',monospace;color:#171A1F;letter-spacing:-0.03em\" ref=\"{{ refWarm }}\">~31 ms<\u002Fspan>\n<span style=\"font:400 13.5px/1.6 'IBM Plex Sans',sans-serif;color:#5A6472\">Verify wall-time in a warm process.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin-top:16px;font:400 13.5px/1.7 'IBM Plex Sans',sans-serif;color:#5A6472;text-wrap:pretty\">From local tests on the Python reference. Your numbers will differ.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"padding:52px 0;border-top:1px solid #E7EAEF\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">09<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">Use it<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">Two blocks to copy.<\u002Fh2>\n\n<div style=\"margin-top:30px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;overflow:hidden\">\n<div style=\"display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #E7EAEF\">\n<span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">Install the CLI<\u002Fspan>\n<span style=\"margin-left:auto;font:500 11px/1 'IBM Plex Mono',monospace;color:#2F7D52\"><sc-if value=\"{{ copiedInstall }}\" hint-placeholder-val=\"{{ false }}\">copied<\u002Fsc-if><\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ copyInstall }}\" aria-label=\"Copy install command\" style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#5A6472;background:#FFFFFF;border:1px solid #D8DDE5;border-radius:5px;padding:7px 9px;cursor:pointer;transition:color .18s ease,border-color .18s ease,box-shadow .18s ease\" style-hover=\"color:#171A1F;border-color:#4F51D8;box-shadow:0 8px 20px -12px rgba(79,81,216,0.5)\">copy<\u002Fbutton>\n<\u002Fdiv>\n<pre style=\"margin:0;padding:18px;overflow-x:auto;background:rgba(255,255,255,0.82)\"><code style=\"font:400 13.5px/1.7 'IBM Plex Mono',monospace;color:#171A1F;white-space:pre\">pipx install scpe-protocol<\u002Fcode><\u002Fpre>\n<\u002Fdiv>\n\n<div style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;overflow:hidden\">\n<div style=\"display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #E7EAEF\">\n<span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">Add the Action<\u002Fspan>\n<span style=\"margin-left:auto;font:500 11px/1 'IBM Plex Mono',monospace;color:#2F7D52\"><sc-if value=\"{{ copiedAction }}\" hint-placeholder-val=\"{{ false }}\">copied<\u002Fsc-if><\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ copyAction }}\" aria-label=\"Copy workflow step\" style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#5A6472;background:#FFFFFF;border:1px solid #D8DDE5;border-radius:5px;padding:7px 9px;cursor:pointer;transition:color .18s ease,border-color .18s ease,box-shadow .18s ease\" style-hover=\"color:#171A1F;border-color:#4F51D8;box-shadow:0 8px 20px -12px rgba(79,81,216,0.5)\">copy<\u002Fbutton>\n<\u002Fdiv>\n<pre style=\"margin:0;padding:18px;overflow-x:auto;background:rgba(255,255,255,0.82)\"><code style=\"font:400 13.5px/1.7 'IBM Plex Mono',monospace;color:#171A1F;white-space:pre\">scpe-verify report.pdf --policy ~/.ssh/allowed_signers<\u002Fcode><\u002Fpre>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:13px 18px;border-top:1px solid #E7EAEF\">\n<span style=\"flex:none;font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#E9EDF2;background:#5C2B2E;border-radius:4px;padding:5px 8px;text-transform:uppercase\">scope<\u002Fspan>\n<span style=\"flex:1;min-width:240px;font:400 13.5px/1.6 'IBM Plex Sans',sans-serif;color:#5A6472;text-wrap:pretty\">A record is bound to the bytes it was signed for, by a digest inside the signed payload. Move it onto another file and the binding fails; it cannot follow.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:13px 18px;border-top:1px solid #E7EAEF\">\n<span style=\"flex:none;font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#E9EDF2;background:#5C2B2E;border-radius:4px;padding:5px 8px;text-transform:uppercase\">v0.1.x legacy<\u002Fspan>\n<span style=\"flex:1;min-width:240px;font:400 13.5px/1.6 'IBM Plex Sans',sans-serif;color:#5A6472;text-wrap:pretty\">The old Action verifies an envelope format this project no longer produces. An exact pin on v0.1.x does not break — it keeps running, checking the wrong thing.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:14px;display:flex;flex-wrap:wrap;gap:10px\">\n<a href=\"https://github.com/augbastos/scpe\" style=\"font:400 12.5px/1 'IBM Plex Mono',monospace;color:#171A1F;border:1px solid #D8DDE5;border-radius:6px;padding:11px 13px;transition:border-color .18s ease,box-shadow .18s ease\" style-hover=\"border-color:#4F51D8;color:#171A1F;box-shadow:0 10px 26px -14px rgba(79,81,216,0.55)\">github.com/augbastos/scpe<\u002Fa>\n<a href=\"https://pypi.org/project/scpe-protocol\" style=\"font:400 12.5px/1 'IBM Plex Mono',monospace;color:#171A1F;border:1px solid #D8DDE5;border-radius:6px;padding:11px 13px;transition:border-color .18s ease,box-shadow .18s ease\" style-hover=\"border-color:#4F51D8;color:#171A1F;box-shadow:0 10px 26px -14px rgba(79,81,216,0.55)\">pypi.org/project/scpe-protocol<\u002Fa>\n<a href=\"https://github.com/augbastos/scpe/blob/main/spec/SPECIFICATION.md\" style=\"font:400 12.5px/1 'IBM Plex Mono',monospace;color:#171A1F;border:1px solid #D8DDE5;border-radius:6px;padding:11px 13px;transition:border-color .18s ease,box-shadow .18s ease\" style-hover=\"border-color:#4F51D8;color:#171A1F;box-shadow:0 10px 26px -14px rgba(79,81,216,0.55)\">spec / scpe/1<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin-top:16px;font:400 14.5px/1.7 'IBM Plex Sans',sans-serif;color:#5A6472;text-wrap:pretty\">The specification, the threat model, and the 16 normative test vectors all live in the repo. Read them before you trust this.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"padding:52px 0;border-top:1px solid #E7EAEF\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">10<\u002Fspan>\n<span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">Status<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"font:500 clamp(20px,3vw,29px)/1.32 'IBM Plex Sans',sans-serif;letter-spacing:-0.018em;color:#171A1F;max-width:720px;text-wrap:pretty\">Where it stands — and where you come in.<\u002Fh2>\n<div style=\"display:flex;align-items:center;gap:12px;margin:34px 0 16px\"><span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">What is not done<\u002Fspan><span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan><\u002Fdiv><ul style=\"background:rgba(240,242,247,0.80);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:6px 20px 12px\">\n<li style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #E7EAEF\"><span style=\"flex:none;font-size:8px;line-height:1.9;color:#4F51D8\" aria-hidden=\"true\">◆<\u002Fspan><span style=\"flex:1;font:400 14px/1.6 'IBM Plex Sans',sans-serif;color:#171A1F\"><span style=\"font-family:'IBM Plex Mono',monospace\">scpe/1<\u002Fspan> — early. Breaking changes are expected before 1.0.<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #E7EAEF\"><span style=\"flex:none;font-size:8px;line-height:1.9;color:#4F51D8\" aria-hidden=\"true\">◆<\u002Fspan><span style=\"flex:1;font:400 14px/1.6 'IBM Plex Sans',sans-serif;color:#171A1F\">Level 3, third-party countersignature, is on the roadmap and <span style=\"font-weight:500\">not implemented<\u002Fspan>.<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #E7EAEF\"><span style=\"flex:none;font-size:8px;line-height:1.9;color:#4F51D8\" aria-hidden=\"true\">◆<\u002Fspan><span style=\"flex:1;font:400 14px/1.6 'IBM Plex Sans',sans-serif;color:#171A1F\">An open protocol, not a standard. Becoming a shared protocol is a stated goal, not an achieved fact.<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #E7EAEF\"><span style=\"flex:none;font-size:8px;line-height:1.9;color:#4F51D8\" aria-hidden=\"true\">◆<\u002Fspan><span style=\"flex:1;font:400 14px/1.6 'IBM Plex Sans',sans-serif;color:#171A1F\">No external security audit. There is a threat model, 26 test vectors and three implementations that must agree — none of that is review by someone with no stake in the answer.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<div style=\"display:flex;align-items:center;gap:12px;margin:34px 0 16px\"><span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#5A6472;text-transform:uppercase\">How to help<\u002Fspan><span style=\"flex:1;height:1px;background:#E7EAEF\" aria-hidden=\"true\"><\u002Fspan><\u002Fdiv><ul style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px\">\n<li style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">01<\u002Fspan><span style=\"font:500 15px/1.4 'IBM Plex Sans',sans-serif;color:#171A1F\">Read the spec, then argue with it<\u002Fspan><span style=\"font:400 13.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">The specification and the threat model live in the repo. Where they are wrong, unclear, or silent, <a href=\"https://github.com/augbastos/scpe\">open an issue<\u002Fa>.<\u002Fspan><\u002Fli>\n<li style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">02<\u002Fspan><span style=\"font:500 15px/1.4 'IBM Plex Sans',sans-serif;color:#171A1F\">Write a fourth verifier<\u002Fspan><span style=\"font:400 13.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">Run the 16 normative test vectors against your implementation. Reaching the same verdict as Core covers 13 vectors, Full covers all 16, and each declares which.<\u002Fspan><\u002Fli>\n<li style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">03<\u002Fspan><span style=\"font:500 15px/1.4 'IBM Plex Sans',sans-serif;color:#171A1F\">Run it at level 1<\u002Fspan><span style=\"font:400 13.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">Zero friction: no envelope, no signing key, no install. Point the Action at a real repository and report what breaks.<\u002Fspan><\u002Fli>\n<li style=\"background:rgba(252,253,254,0.74);animation:scpeRise linear both;animation-timeline:view();animation-range:entry 4% cover 22%;border:1px solid #E7EAEF;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#4F51D8\">04<\u002Fspan><span style=\"font:500 15px/1.4 'IBM Plex Sans',sans-serif;color:#171A1F\">Try to break a verdict<\u002Fspan><span style=\"font:400 13.5px/1.65 'IBM Plex Sans',sans-serif;color:#5A6472\">If one verifier accepts what another rejects, that is a bug against the test vectors. <a href=\"https://github.com/augbastos/scpe\">Send the envelope that did it<\u002Fa>.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<footer style=\"padding:44px 0 56px;border-top:1px solid #E7EAEF;display:flex;flex-wrap:wrap;gap:28px 40px;align-items:flex-start\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<svg sc-camel-view-box=\"0 0 64 64\" width=\"20\" height=\"20\" style=\"display:block;flex:none\" aria-hidden=\"true\"><path fill=\"#171A1F\" d=\"M10 12H26V19H17V45H26V52H10ZM54 12H38V19H47V45H38V52H54Z\"><\u002Fpath><path fill=\"#4F51D8\" d=\"M32 22.5 41.5 32 32 41.5 22.5 32Z\"><\u002Fpath><\u002Fsvg>\n<span style=\"font:600 12.5px/1 'IBM Plex Sans',sans-serif;letter-spacing:.2em;color:#171A1F\">SCPE<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px;font:400 13px/1.6 'IBM Plex Sans',sans-serif;color:#5A6472\">\n<span>Code licensed Apache-2.0. The specification has its own licence.<\u002Fspan>\n<\u002Fdiv>\n<nav style=\"margin-left:auto;display:flex;flex-wrap:wrap;gap:16px;font:400 13px/1 'IBM Plex Sans',sans-serif\">\n<a href=\"https://github.com/augbastos/scpe\">repo<\u002Fa>\n<a href=\"https://pypi.org/project/scpe-protocol\">pypi<\u002Fa>\n<a href=\"https://github.com/augbastos/scpe/blob/main/spec/SPECIFICATION.md\">spec<\u002Fa>\n<\u002Fnav>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultProfile&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;SCPE-C&quot;,&quot;SCPE-I&quot;,&quot;SCPE-V&quot;,&quot;SCPE-A&quot;,&quot;SCPE-M&quot;,&quot;SCPE-DATA&quot;,&quot;SCPE-D&quot;,&quot;SCPE-AR&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;sealVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;verified&quot;,&quot;failing&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;heroMark&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;large&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;large&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  state = { profile: null, anchor: 'flag', copied: '' };\n  cost = { kb: React.createRef(), cold: React.createRef(), warm: React.createRef(), wrap: React.createRef() };\n\n  componentDidMount() {\n    const wrap = this.cost.wrap.current;\n    if (!wrap || typeof IntersectionObserver === 'undefined') return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    this._io = new IntersectionObserver(entries => {\n      if (entries.some(e => e.isIntersecting)) {\n        this._io.disconnect();\n        this._io = null;\n        this.countUp();\n      }\n    }, { threshold: 0.45 });\n    this._io.observe(wrap);\n    this.revealNet();\n  }\n\n  revealNet() {\n    this._net = () => {\n      const els = document.querySelectorAll('[style*=\"scpeRise\"]');\n      for (let i = 0; i < els.length; i++) {\n        const r = els[i].getBoundingClientRect();\n        if (r.bottom > 0 && r.bottom < window.innerHeight * 0.6) {\n          if (parseFloat(getComputedStyle(els[i]).opacity) < 0.9) {\n            for (let j = 0; j < els.length; j++) els[j].style.animation = 'none';\n          }\n          window.removeEventListener('scroll', this._net);\n          this._net = null;\n          return;\n        }\n      }\n    };\n    window.addEventListener('scroll', this._net, { passive: true });\n  }\n\n  countUp() {\n    const targets = [\n      [this.cost.kb, 1.5, v => '~' + v.toFixed(1) + ' KB'],\n      [this.cost.cold, 275, v => '~' + Math.round(v) + ' ms'],\n      [this.cost.warm, 39, v => '~' + Math.round(v) + ' ms']\n    ];\n    const t0 = performance.now(), dur = 1150;\n    const tick = now => {\n      const p = Math.min(1, (now - t0) / dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      targets.forEach(t => { if (t[0].current) t[0].current.textContent = t[2](t[1] * e); });\n      if (p < 1) this._raf = requestAnimationFrame(tick);\n      else targets.forEach(t => { if (t[0].current) t[0].current.textContent = t[2](t[1]); });\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  flash(key) {\n    this.setState({ copied: key });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ copied: '' }), 1800);\n  }\n\n  copy(key, text) {\n    const done = () => this.flash(key);\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(done, () => this.fallback(text, done));\n    } else {\n      this.fallback(text, done);\n    }\n  }\n\n  fallback(text, done) {\n    const ta = document.createElement('textarea');\n    ta.value = text;\n    ta.setAttribute('aria-hidden', 'true');\n    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';\n    document.body.appendChild(ta);\n    ta.select();\n    try { document.execCommand('copy'); } catch (e) {}\n    ta.remove();\n    done();\n  }\n\n  componentWillUnmount() {\n    clearTimeout(this._t);\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._io) this._io.disconnect();\n    if (this._net) window.removeEventListener('scroll', this._net);\n  }\n\n  renderVals() {\n    const install = 'pipx install scpe-protocol';\n    const action = 'scpe-verify report.pdf --policy ~/.ssh/allowed_signers';\n    const def = this.props.defaultProfile || 'none';\n    const sel = this.state.profile || (def === 'none' ? null : def);\n    const variant = this.props.sealVariant || 'both';\n    const a = this.state.anchor;\n\n    const codes = { C: 'SCPE-C', I: 'SCPE-I', V: 'SCPE-V', A: 'SCPE-A', M: 'SCPE-M', DATA: 'SCPE-DATA', D: 'SCPE-D', AR: 'SCPE-AR' };\n    const classes = { 'C': \"Source code.\", 'I': \"Still images.\", 'V': \"Video.\", 'A': \"Audio.\", 'M': \"Machine-learning models.\", 'DATA': \"Datasets.\", 'D': \"Documents.\", 'AR': \"Any other artifact — the catch-all.\" };\n    const selKey = Object.keys(codes).filter(k => codes[k] === sel)[0] || 'C';\n\n    const out = {\n      refCost: this.cost.wrap,\n      refKB: this.cost.kb,\n      refCold: this.cost.cold,\n      refWarm: this.cost.warm,\n      selProfile: sel || '—',\n      selClass: sel ? classes[selKey] : 'Select a profile to see what it covers.',\n      markLarge: (this.props.heroMark || 'large') === 'large',\n      showVerified: variant !== 'failing',\n      showFailing: variant !== 'verified',\n      onFlag: a === 'flag',\n      onBundled: a === 'bundled',\n      onForge: a === 'forge',\n      flagPressed: a === 'flag' ? 'true' : 'false',\n      bundledPressed: a === 'bundled' ? 'true' : 'false',\n      forgePressed: a === 'forge' ? 'true' : 'false',\n      pickFlag: () => this.setState({ anchor: 'flag' }),\n      pickBundled: () => this.setState({ anchor: 'bundled' }),\n      pickForge: () => this.setState({ anchor: 'forge' }),\n      copiedInstall: this.state.copied === 'install',\n      copiedAction: this.state.copied === 'action',\n      copyInstall: () => this.copy('install', install),\n      copyAction: () => this.copy('action', action)\n    };\n    Object.keys(codes).forEach(k => {\n      out['p' + k] = () => this.setState({ profile: codes[k] });\n      out['on' + k] = sel === codes[k];\n      out['pr' + k] = sel === codes[k] ? 'true' : 'false';\n    });\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
