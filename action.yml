name: SCPE Seal
description: >-
  Verify a signed SCPE contribution on a PR and post a decision-first seal:
  identity, risk band, tests, provenance.
author: Augusto Bastos
branding:
  icon: shield
  color: green

inputs:
  envelope:
    description: >-
      Path to a spec SCPE envelope zip (what `scpe-envelope pack` writes) that
      the contributor committed on the PR. EMPTY by default, which selects the
      spec's §9 transport instead: the attestation rides in the PR description
      and no binary blob ever lands in history. Empty means "read the
      attestation from the PR body", not "check nothing".
    required: false
    default: ""
  attestation:
    description: >-
      Path to a text file carrying an `<!-- SCPE-ATTESTATION-v1 ... -->` block.
      Only needed when the attestation was committed to a file instead of posted
      in the PR description; empty (the default) reads the PR body itself. The
      block is extracted by the reference verifier, not by this Action — one
      parser, one answer.
    required: false
    default: ""
  keys:
    description: >-
      Path to an OpenSSH authorized-keys file to anchor the signature against,
      instead of fetching the contributor's public keys from their forge. This is
      what makes an air-gapped runner and `provider: local` work. It also pins
      `key_source` to "flag", and the seal prints that: "verified against the
      keys this repository supplied" is a different claim from "verified against
      the keys github.com serves for that account", and spec §8 step 4 discloses
      the anchor precisely so the two never look alike.
    required: false
    default: ""
  repo:
    description: Path to the checked-out repository to verify against.
    required: false
    default: .
  run-tests:
    description: Run the repo's test suite inside the untrusted job.
    required: false
    default: "true"
  require:
    description: >-
      Gate mode. "false" (default) keeps today's informational seal: a report,
      never a verdict that blocks merge. "true" makes this repository require a
      signed scpe contribution — an unattested PR or any status other than
      "verified" (spec scpe/0.1 §8) is a FAILING check, not just a comment.
      The require DECISION is computed here, in this untrusted step (no
      secrets, read-only token) and handed to the trusted job via results.json;
      the trusted job only ever reads it, never recomputes it.
    required: false
    default: "false"
  level:
    description: >-
      SCPE assurance level — see docs/LEVELS.md for the full trade-off table.
      Levels are cumulative: each one implies everything the level below it
      checks. Only "1" and "2" are implemented; any other value (including "3")
      fails this step immediately with a clear error instead of silently
      falling back to level 2.
        "1" — AI-disclosure lint only, zero-friction. No attestation, no signing
        key, no install of any kind — it runs ONLY reference/disclosure.py (via
        reference/level1_lint.py, read straight out of this action's own
        checkout, github.action_path) against the PR body and commit messages,
        looking for an `Assisted-by:` trailer or a checked PR-template checkbox.
        "2" (default) — a valid signed SCPE contribution is required: manifest,
        SSHSIG signature and diff are checked by
        reference/standalone/verify_envelope.py, the single-file normative
        verifier, read out of this same checkout. This IMPLIES level 1, but at
        the GATE, not in the verifier: spec scpe/0.1 keeps `ai_disclosure` out
        of the eight §8 statuses, so the seal reports `disclosure_present` read
        from the SIGNED manifest and refuses the gate when it is missing. That
        is still strictly stronger than level 1 — the disclosure lives inside
        the bytes the signature covers, instead of in free text a contributor
        can edit afterwards — but it is this Action enforcing it, not the
        protocol.
        "3" — third-party countersignature (a maintainer/reviewer co-signs the
        contribution, independent of the author). ROADMAP — not implemented in
        this Action or in spec scpe/0.1.
      Combines with `require` exactly like the full seal: require=false
      reports; require=true fails the check and posts
      "⚠️ Missing AI-use disclosure ..." when the level-1 signal is absent.
    required: false
    default: "2"

outputs:
  results:
    description: Path to the machine-readable results.json emitted by `scpe seal --json`.
    value: ${{ steps.seal.outputs.results }}
  status:
    description: >-
      One of the eight spec scpe/0.1 §8 statuses, verbatim: "unattested",
      "unsupported-version", "unsupported-provider", "unsupported-subject",
      "identity-unverifiable", "signature-invalid", "tampered", "verified".
      Exactly one of them passes: "verified". The specific failure is
      deliberately NOT collapsed into a single "not-verified" — "tampered" and
      "identity-unverifiable" ask a maintainer for completely different
      reactions. The status is always emitted, including when require=false,
      and there is no "n/a": the status is information, the gate is
      `gate-pass`. At level=1 it instead reflects
      disclosure presence ("verified"/"unattested"), since level 1 has no
      signature to have an opinion about.
    value: ${{ steps.seal.outputs.status }}
  gate-pass:
    description: >-
      "true" unless require=true and the contribution falls short of a gate pass.
      A pass needs all three, not just the status: `status == "verified"`, an
      `ai_disclosure.mode` present in the SIGNED manifest (level 2 implies level 1
      — docs/LEVELS.md), and a key anchor of `forge` or `flag`, never `bundled`.
      A contribution can therefore be `verified` and still fail the gate, which is
      deliberate: `bundled` keys arrived with the submission and say nothing about
      the named account. results.json's `fail_message` names which of the three
      failed. This is the require DECISION for the trusted job to act on.
    value: ${{ steps.seal.outputs.gate-pass }}

runs:
  using: composite
  steps:
    - id: seal
      shell: bash
      # Attacker-controlled PR fields (body, base/head SHAs) reach the script ONLY
      # through env, never inlined into the run: text — a hostile PR body cannot
      # break out of a string literal and inject shell. It does not reach argv
      # either: `--pr-body-env PR_BODY` tells the sealer to read the VARIABLE, so
      # the body is never a command-line argument that could show up in a process
      # list or trip an argv length limit. REPO_DIR / REQUIRE / ENVELOPE /
      # ATTESTATION / KEYS / RUN_TESTS come from trusted action inputs and ride the
      # same env because the command below expands them as shell variables.
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO_DIR: ${{ inputs.repo }}
        REQUIRE: ${{ inputs.require }}
        ENVELOPE: ${{ inputs.envelope }}
        ATTESTATION: ${{ inputs.attestation }}
        KEYS: ${{ inputs.keys }}
        RUN_TESTS: ${{ inputs.run-tests }}
      # UNTRUSTED wrapper: deterministic risk + tests, no LLM, no secrets.
      # Emits results.json for the trusted job to post verbatim.
      run: |
        if [ "${{ inputs.level }}" = "1" ]; then
          # LEVEL 1 — zero-friction AI-disclosure lint. No attestation, no signing
          # key, and no package install of any kind: this reads
          # reference/level1_lint.py straight out of the action's OWN checkout
          # (github.action_path is this repo at the tag the caller pinned),
          # which in turn only checks the PR body + commit messages already
          # sitting in the checkout — no secrets, no network. Always exits 0 so
          # the artifact reaches the trusted job even when require=true and the
          # signal is absent (spec §8: "unattested" is a state, not an error).
          # PR_BODY / BASE_SHA / HEAD_SHA / REPO_DIR / REQUIRE are exported by the
          # step-level env: block above — never inlined into this script — so an
          # attacker-controlled PR body cannot inject shell here.
          python3 "${{ github.action_path }}/reference/level1_lint.py"
          echo "results=results.json" >> "$GITHUB_OUTPUT"
          echo "status=$(python3 -c "import json; print(json.load(open('results.json'))['status'])")" >> "$GITHUB_OUTPUT"
          echo "gate-pass=$(python3 -c "import json; print(str(json.load(open('results.json'))['gate_pass']).lower())")" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "${{ inputs.level }}" != "2" ]; then
          # Anything other than "1" (handled above) or "2" is REJECTED, not
          # silently treated as level 2 — a caller who sets level: 3 expecting
          # third-party countersignature must get a clear failure, never a
          # false sense of assurance this Action does not provide. Level 3 is
          # roadmap only (docs/LEVELS.md); it is not implemented anywhere in
          # this repo. No secrets, no attestation read — this check runs before
          # either.
          echo "::error::level=${{ inputs.level }} is not supported. This Action implements level 1 (AI-disclosure lint) and level 2 (signed SCPE contribution, default). Level 3 (third-party countersignature) is on the roadmap, not implemented — see docs/LEVELS.md. Set level: 1 or level: 2." >&2
          exit 1
        fi

        # LEVEL 2 — the signed seal. Both branches that used to live here (the
        # informational one and the gated one) collapsed into this single call:
        # the sealer computes status/require/gate_pass itself and exits 0 even for
        # an unattested PR, so there is nothing left for the shell to decide.
        #
        # `require` is normalized to a strict boolean before it becomes a flag.
        # GitHub hands inputs through as free text ("true", "True", "yes", ""),
        # `--require` accepts only true|false, and the middle of a merge gate is
        # the worst possible place to discover an argument-parsing error. Anything
        # that is not literally "true" is false, which keeps gate mode opt-in even
        # when a caller mistypes it. Read through $REQUIRE (set in env: above) rather
        # than pasting a GitHub expression into the script — an expression expanded
        # into shell text is the injection shape this two-job split exists to avoid.
        # (Writing an empty expression here, even inside a comment, is itself fatal:
        # the template engine parses this whole block and rejects the file before any
        # step runs. Describe expressions in prose; never spell an empty one out.)
        require_flag=false
        [ "$REQUIRE" = "true" ] && require_flag=true

        run_tests=""
        if [ "$RUN_TESTS" = "true" ]; then
          run_tests="--run-tests"
        fi

        # The verifier arrives through the action's OWN checkout, exactly like
        # level 1 does — no download and no PyPI at verification time. The VERDICT
        # can still reach the network: with `keys` unset (the default) and the §9
        # PR-body transport carrying no key set, the verifier fetches the account's
        # published keys from its provider's fixed host. That fetch IS what
        # `key_source: forge` means. Pass `keys` to keep the step fully offline.
        # `${{ github.action_path }}` is this repository at the tag the caller
        # pinned, so the bytes that decide the verdict are the bytes of that tag,
        # not "whatever is on PyPI at the moment this PR happened to run". The
        # package is stdlib-only, which is what makes running it from a bare
        # PYTHONPATH possible at all. PYTHONPATH is REPLACED rather than appended
        # to on purpose: a contributor-influenced PYTHONPATH must not be able to
        # shadow `scpe` or `reference` with its own module of the same name.
        #
        # Input precedence, resolved inside the sealer: --envelope (a committed
        # zip) beats --attestation (a committed text file) beats the PR body. The
        # optional flags are omitted entirely when unset, so an unset input never
        # degrades into "a path that is the empty string".
        #
        # There is no `set +e` here: `scpe seal` exits 0 whenever it produced a
        # results.json, including for `unattested` and every other failing §8
        # status. A non-zero exit therefore means an OPERATIONAL failure (repo
        # missing, file unreadable) — and that must fail the step loudly instead
        # of being laundered into a verdict of "unattested".
        PYTHONPATH="${{ github.action_path }}" python3 -m scpe.cli seal \
          --repo "$REPO_DIR" \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" \
          --pr-body-env PR_BODY \
          ${ENVELOPE:+--envelope "$ENVELOPE"} \
          ${ATTESTATION:+--attestation "$ATTESTATION"} \
          ${KEYS:+--keys "$KEYS"} \
          $run_tests \
          --require "$require_flag" \
          --level 2 \
          --render-comment \
          --json > results.json

        # A §9 attestation carries no diff — only the digest of one — so the diff
        # is recomputed here as `git diff BASE...HEAD` (three dots, matching the
        # producer) and checked against the signed digest. That needs the base
        # commit to actually be in the checkout: with actions/checkout's default
        # `fetch-depth: 1` it is not, and the seal reports
        # diff_source: "unavailable" and a `tampered` status whose detail reads
        # "no diff available to check integrity against". The `fetch-depth: 0` hint
        # rides in results.json's `diff_note`; it is NOT rendered into the PR
        # comment, so a maintainer who misconfigures this sees "tampered" and has to
        # come here to learn why. Same honest limitation level 1 already documents
        # for commit-trailer reads.
        echo "results=results.json" >> "$GITHUB_OUTPUT"
        echo "status=$(python3 -c "import json; print(json.load(open('results.json'))['status'])")" >> "$GITHUB_OUTPUT"
        echo "gate-pass=$(python3 -c "import json; print(str(json.load(open('results.json'))['gate_pass']).lower())")" >> "$GITHUB_OUTPUT"
