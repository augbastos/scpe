# CI for SCPE.
#
# CONTRIBUTING.md's central claim is "three implementations, one result": any change to the
# spec or to a verifier must keep the Python reference, the Go port, and the Rust port
# reaching the same verdict on every normative vector. Until now that claim was enforced by
# hand and advertised by a hardcoded badge image — which stayed green through a broken test.
# In a project whose product *is* automated verification, an unverified green is the one bug
# that discredits everything else, so these jobs make the claim mechanical.
#
# Nothing here needs a secret or a write permission, so a pull request from a fork runs the
# exact same checks with the exact same authority as a push to main.

name: CI

on:
  push:
    # Default branch only: a topic branch with an open PR is already covered by
    # `pull_request`, and listening to both would run every commit twice for one signal.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full pytest suite. The Go and Rust toolchains are installed HERE on purpose: without
  # them tests/test_differential_verifiers.py degrades into ~56 clean SKIPs, and a green run
  # that quietly skipped the cross-implementation check is precisely the hollow green this
  # workflow exists to kill. The dedicated `go` and `rust` jobs below test those ports on
  # their own terms; this one tests that they still agree with Python.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # tests/test_stress_100prs.py signs ~100 real envelopes; bound it
    strategy:
      fail-fast: false # a 3.12-only break must not hide whether 3.11 is still fine
      matrix:
        # Mirrors the `Programming Language :: Python :: 3.x` classifiers in pyproject.toml.
        # Adding a version here without adding its classifier would test support the package
        # does not claim; keep the two in lockstep.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # go.mod is the single declaration of the Go version; reading it here keeps CI from
      # drifting away from what the module says it needs.
      - uses: actions/setup-go@v5
        with:
          go-version-file: impl/go/go.mod
          cache: false # the module has zero third-party deps and no go.sum — nothing to cache

      # impl/rust/Cargo.toml declares no rust-version, but Cargo.lock is a v4 lockfile, which
      # needs Cargo >= 1.78; stable satisfies that. This action publishes branch and exact
      # version refs (@stable, @1.78.0) rather than major tags, so it cannot be pinned the way
      # the actions/* ones are.
      - uses: dtolnay/rust-toolchain@stable

      # All three verifiers shell out to `ssh-keygen -Y verify` (OpenSSH >= 8.2), conftest.py
      # mints a throwaway ed25519 key per test, and the producer drives `git`. These are hard
      # dependencies of the suite, so assert them up front instead of letting a few hundred
      # tests fail with a confusing error.
      - name: Check external binaries the suite depends on
        run: |
          command -v ssh-keygen
          command -v git
          ssh -V

      # Editable, with the dev extra. tests/test_producer_cli.py skips unless the
      # `scpe-envelope` console script is on PATH and tests/test_action_yaml.py needs pyyaml,
      # so installing less silently tests less. The package itself is stdlib-only — that is
      # what lets the Action run it straight from a checkout, with no install step.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # From the repo root: there is no pytest config anywhere, and the suite imports
      # `tests.conftest` as a package, so the root has to be what pytest prepends to sys.path.
      - name: pytest
        run: pytest --durations=10

  # The Go port on its own terms. impl/go/internal/scpe/vectors_test.go walks
  # spec/test-vectors/ and hard-asserts exactly 18 directories, so this needs the whole
  # checkout rather than impl/go alone. Building first separates "the port no longer
  # compiles" from "the port disagrees with a vector" in the log.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: impl/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: impl/go/go.mod
          cache: false

      # The Go verifier is stdlib plus this one subprocess (impl/go/internal/scpe/verify.go).
      - run: command -v ssh-keygen

      - run: go build ./...
      - run: go test ./...

  # The Rust port on its own terms; impl/rust/tests/vectors.rs resolves the vectors from
  # CARGO_MANIFEST_DIR, so it too needs the full checkout.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cargo.lock is committed deliberately (see .gitignore) so the verifier builds from a
      # fixed dependency set; caching on its hash is therefore exact, and cold builds of the
      # 22-crate tree are what dominate this job's wall-clock.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            impl/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('impl/rust/Cargo.lock') }}

      # The Rust verifier shells out to ssh-keygen as well (impl/rust/src/scpe.rs).
      - run: command -v ssh-keygen

      # --locked enforces the reason Cargo.lock is committed: a run that would have silently
      # resolved a different dependency version fails instead.
      - name: cargo test
        run: cargo test --locked
        working-directory: impl/rust

  # Runs the single-file reference verifier the way an auditor would — a bare interpreter,
  # nothing pip-installed, no pytest, no package import — which is the only arrangement that
  # actually proves the README's claim that reference/standalone/verify_envelope.py is
  # stdlib-only and readable top to bottom.
  #
  # The committed vectors are treated as IMMUTABLE. spec/test-vectors/make_vectors.py mints
  # fresh throwaway keys (its _key/ directory is gitignored and absent from a clean checkout)
  # and re-signs every vector, so a regenerate-and-diff step would rewrite every signature and
  # report a full diff on every run. The committed bytes are the conformance contract; CI
  # verifies them, it does not reproduce them.
  #
  # Scope is the 18 normative vectors, the same count impl/go/internal/scpe/vectors_test.go
  # and impl/rust/tests/vectors.rs hard-assert. The seven adversarial vectors get the
  # `adversarial` job below, which runs them against all three implementations; repeating
  # their Python leg here would spend a second run to produce the same one signal.
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: command -v ssh-keygen

      - name: Verify every normative vector against its expected status
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          VERIFIER = Path("reference/standalone/verify_envelope.py")
          ROOT = Path("spec/test-vectors")
          # The count is asserted, not just iterated: the Go and Rust harnesses hard-assert
          # 18 as well, so a vector added on one side and forgotten on the other is
          # conformance drift and should fail here rather than pass by silently doing less.
          EXPECTED_COUNT = 18

          failures = []
          vectors = sorted(d for d in ROOT.iterdir()
                           if d.is_dir() and (d / "expected.json").is_file())
          if len(vectors) != EXPECTED_COUNT:
              sys.exit(f"{ROOT}: expected {EXPECTED_COUNT} vectors, found "
                       f"{len(vectors)}: {[d.name for d in vectors]}")
          for vector in vectors:
              # --keys stands in for the forge fetch (spec/test-vectors/README.md), so this
              # makes zero network calls: each vector ships the public half it needs.
              proc = subprocess.run(
                  [sys.executable, str(VERIFIER), str(vector),
                   "--keys", str(vector / "keys"), "--json"],
                  capture_output=True, text=True, timeout=60)
              want = json.loads(
                  (vector / "expected.json").read_text(encoding="utf-8"))["status"]
              try:
                  got = json.loads(proc.stdout)["status"]
              except (ValueError, KeyError, TypeError):
                  got = None
              # The exit-code contract is part of the spec: 0 iff verified.
              ok = got == want and (proc.returncode == 0) == (want == "verified")
              print(f"{'ok  ' if ok else 'FAIL'} {vector.as_posix()}: "
                    f"want={want} got={got} rc={proc.returncode}")
              if not ok:
                  failures.append(f"{vector.as_posix()}: want={want} got={got} "
                                  f"rc={proc.returncode}\n{proc.stderr[-400:]}")

          if failures:
              sys.exit("\n\n".join(failures))
          PY

  # The seven adversarial vectors, against all three implementations.
  #
  # spec/test-vectors-adversarial/ is a sibling of spec/test-vectors/ rather than a
  # subdirectory precisely because impl/go/internal/scpe/vectors_test.go and
  # impl/rust/tests/vectors.rs hard-assert a directory count of exactly 18 and are treated as
  # frozen verifier code. That keeps the 18-vector conformance contract intact, but it also
  # left the pack's "all three implementations agree" claim resting on whoever last
  # regenerated it having run both ports by hand. spec/test-vectors-adversarial/verify_all.py
  # cannot close that gap: it is a generator aid, printing what the Python verifier said and
  # exiting 0 no matter what it printed. This job drives the two ports through the same CLIs
  # an integrator would invoke, so the claim becomes mechanical without either frozen test
  # file being edited.
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: impl/go/go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      # All three verifiers shell out to it.
      - run: command -v ssh-keygen

      # Out to RUNNER_TEMP: a verifier binary sitting in the checkout could be picked up as a
      # committed file by a later step, and the point of this job is that the tree is exactly
      # what was pushed.
      - name: Build the Go verifier
        run: go build -o "$RUNNER_TEMP/scpe-verify-go" ./cmd/scpe-verify
        working-directory: impl/go

      # Debug profile — seven vectors do not need optimised code — and deliberately no cargo
      # cache: a second cache key for the same crate tree would double this repo's cache
      # footprint to shorten one short build. --locked for the same reason as the `rust` job.
      - name: Build the Rust verifier
        run: cargo build --locked
        working-directory: impl/rust

      - name: Every adversarial vector, every implementation, against expected.json
        env:
          # The two paths the build steps above wrote to. `runner.temp` is the expression form
          # of the RUNNER_TEMP the shell used; impl/rust/target/ is cargo's own output
          # directory and is already gitignored.
          GO_VERIFIER: ${{ runner.temp }}/scpe-verify-go
          RUST_VERIFIER: impl/rust/target/debug/scpe-verify
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          ROOT = Path("spec/test-vectors-adversarial")
          # Asserted rather than merely iterated, for the same reason the normative job
          # asserts 18: a vector added here and forgotten should fail loudly, not pass by
          # silently doing less.
          EXPECTED_COUNT = 7

          # The reference verifier runs from the checkout on a bare interpreter, which is all
          # it needs (it is stdlib-only); the ports run as the built binaries the pack's
          # README says were previously invoked by hand.
          IMPLS = [
              ("python", [sys.executable, "reference/standalone/verify_envelope.py"]),
              ("go", [os.environ["GO_VERIFIER"]]),
              ("rust", [os.environ["RUST_VERIFIER"]]),
          ]

          vectors = sorted(d for d in ROOT.iterdir()
                           if d.is_dir() and (d / "expected.json").is_file())
          if len(vectors) != EXPECTED_COUNT:
              sys.exit(f"{ROOT}: expected {EXPECTED_COUNT} vectors, found "
                       f"{len(vectors)}: {[d.name for d in vectors]}")

          failures = []
          for vector in vectors:
              want = json.loads(
                  (vector / "expected.json").read_text(encoding="utf-8"))["status"]
              got, anchor = {}, {}
              for name, argv in IMPLS:
                  # Each vector ships the public half it needs, so --keys keeps this offline;
                  # the Rust port has no forge fetch and requires the flag in any case.
                  proc = subprocess.run(
                      argv + [str(vector), "--keys", str(vector / "keys"), "--json"],
                      capture_output=True, text=True, timeout=120)
                  try:
                      out = json.loads(proc.stdout)
                      got[name], anchor[name] = out["status"], out.get("key_source")
                  except (ValueError, KeyError, TypeError):
                      got[name], anchor[name] = None, None
                  # The exit-code contract is part of the spec and all three ports claim it:
                  # 0 iff verified.
                  if got[name] != want or (proc.returncode == 0) != (want == "verified"):
                      failures.append(
                          f"{vector.as_posix()} [{name}]: want={want} got={got[name]} "
                          f"rc={proc.returncode}\n{proc.stderr[-400:]}")
              # key_source is printed, never asserted: no expected.json in either pack records
              # one, and this project's rule is that an expected value is copied from a real
              # run and never assumed. Printing all three side by side, JSON-encoded, is what
              # turns recording them into a read of this log rather than a manual rebuild of
              # both ports.
              ok = all(got[name] == want for name, _ in IMPLS)
              print(f"{'ok  ' if ok else 'FAIL'} {vector.name}: want={want} | " + "  ".join(
                  f"{name}={got[name]} key_source={json.dumps(anchor[name])}"
                  for name, _ in IMPLS))

          if failures:
              sys.exit("\n\n".join(failures))
          PY
